[project]
name = "litserve-slm"
version = "0.1.0"
description = "SLM inference system with latency-throughput analysis using LitServe and Transformers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "litserve",
    "fastapi",
    "pydantic",
    "transformers",
    "torch",
    "numpy",
    "pyyaml",
    "requests",
    "psutil",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
