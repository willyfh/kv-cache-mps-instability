# Experiment 3: Instability probe — zoomed into the failure zone
# Repeat count aligned to global 5/3 run plan.
# Coarse first-pass sweep with a strict 16-token step centered on 512.
# Focuses on mps only; mps-fp16 has a different failure zone (near 768).
# Use this run to locate suspicious regions, then follow with a local dense sweep if needed.

benchmark_runs: 5
benchmark_warmup_runs: 3
timeout_seconds: 600
benchmark_debug: true

benchmark_base_url: http://localhost:8000
benchmark_results_dir: benchmark_results/instability_probe_final

benchmark_deterministic: true
benchmark_seed: 42
benchmark_use_cache: true


benchmark_capture_qualitative_samples: false
benchmark_collect_memory: false

benchmark_model_names:
  - gpt2-medium

benchmark_execution_modes:
  - mps

benchmark_offered_load_levels:
  - 1

benchmark_max_tokens:
  - 480
  - 496
  - 512
  - 528
  - 544
  - 560
  - 576
  - 592
  - 608
  - 624
  - 640
  - 656

benchmark_prompts:
  long_context: "The following is a technical description of language model inference systems on modern hardware. Language models are deployed in production systems that must balance throughput, latency, and memory usage across different hardware backends such as CPU and GPU. In general, model inference performance depends on model size, sequence length, and hardware efficiency. In this context,"
